name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the CI-gated promotion job needs to write repository contents.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.4"

  test:
    # Ubuntu 26.04 does not provide Python 3.9 via setup-python; preserve the matrix.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and verify package
        run: |
          pip install build
          python -m build
          pip install dist/ccsl-*.whl
          ccsl --version
          ccsl --help

  # Self-update installs pull statusline.py from the stable branch, so a push
  # to main reaches users only after every check above has passed on it.
  promote:
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: promote-stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fast-forward stable
        run: |
          git fetch origin stable
          if git merge-base --is-ancestor HEAD origin/stable; then
            echo "stable already contains $GITHUB_SHA"
          else
            git push origin HEAD:refs/heads/stable
          fi
