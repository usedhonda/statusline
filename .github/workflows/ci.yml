name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify package
        run: |
          pip install build
          python -m build
          pip install dist/ccsl-*.whl
          ccsl --version
          ccsl --help

  # Self-update installs pull statusline.py from the stable branch, so a push
  # to main reaches users only after every check above has passed on it.
  promote:
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: promote-stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward stable
        run: |
          git fetch origin stable
          if git merge-base --is-ancestor HEAD origin/stable; then
            echo "stable already contains $GITHUB_SHA"
          else
            git push origin HEAD:refs/heads/stable
          fi
